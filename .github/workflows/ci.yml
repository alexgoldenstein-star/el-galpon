# Verificación automática: en cada cambio que se sube a GitHub corre todas las pruebas.
# Si algo se rompe, GitHub lo marca en rojo antes de que llegue a los clientes.
name: Pruebas
on:
  push:
  pull_request:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - name: app.js armado desde src/
        run: npm run check
      - name: Reglas de seguridad
        run: npm run test:rules
      - name: Funciones del servidor
        run: npm run test:api
      - name: Sitio de punta a punta
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
          npm run test:e2e
